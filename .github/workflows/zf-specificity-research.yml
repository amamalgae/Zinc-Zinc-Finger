name: ZF specificity research benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/zf-specificity-research.yml"
      - "scripts/benchmark-zf-specificity-models.mjs"
      - "scripts/benchmark-zfmodels-2014.R"
      - "scripts/validate-zfmodels-oob.R"
      - "scripts/analyze-zfmodels-activity.mjs"
      - "scripts/export-bhakta-l6r6-for-predictors.mjs"
      - "scripts/zf-specificity-adapters/**"
      - "tests/zf-specificity-benchmark.test.mjs"
      - "tests/persikov-2015-adapter.test.mjs"
      - "docs/ZF_SPECIFICITY_BENCHMARK.md"
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated baseline benchmark
        run: node scripts/benchmark-zf-specificity-models.mjs
      - name: Run benchmark adapter tests
        run: |
          node tests/zf-specificity-benchmark.test.mjs
          node tests/persikov-2015-adapter.test.mjs

  zfmodels-2014:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install benchmark R packages
        run: Rscript -e 'install.packages(c("jsonlite", "randomForest"), repos="https://cloud.r-project.org")'
      - name: Download Gupta 2014 supplementary bundle from Europe PMC
        run: |
          curl --fail --location --retry 3 \
            https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4005693/supplementaryFiles \
            --output /tmp/pmc4005693-supp.zip
          mkdir -p /tmp/zfmodels-supp
          unzip -q /tmp/pmc4005693-supp.zip -d /tmp/zfmodels-supp
          test -s /tmp/zfmodels-supp/supp_gku132_nar-03543-h-2013-File009.txt
      - name: Validate reconstructed RF on source B1H data without ZFN labels
        run: |
          Rscript scripts/validate-zfmodels-oob.R \
            /tmp/zfmodels-supp/supp_gku132_nar-03543-h-2013-File009.txt
      - name: Export Bhakta exact L6+R6 cohort
        run: node scripts/export-bhakta-l6r6-for-predictors.mjs > /tmp/bhakta-l6r6.json
      - name: Reconstruct ZFModels and benchmark activity ranking
        run: |
          Rscript scripts/benchmark-zfmodels-2014.R \
            /tmp/zfmodels-supp/supp_gku132_nar-03543-h-2013-File009.txt \
            /tmp/bhakta-l6r6.json > /tmp/zfmodels-activity.json
          cat /tmp/zfmodels-activity.json
      - name: Paired bootstrap and cohort sensitivity analysis
        run: node scripts/analyze-zfmodels-activity.mjs /tmp/zfmodels-activity.json
